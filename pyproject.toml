[project]
name = "laytime"
version = "0.1.0"
description = "Reads a voyage's shipping inbox and calculates laytime and demurrage, with a source for every number."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.40",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-json-logger>=3.1",
]

[project.scripts]
laytime = "laytime.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/laytime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
